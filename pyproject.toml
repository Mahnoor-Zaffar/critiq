[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/critiq"]

[project.scripts]
critiq-api = "critiq.apps.api.main:run"
critiq-init-db = "critiq.infrastructure.postgres.init_db:main"
critiq-evaluate = "critiq.ai.evaluation.cli:main"
critiq-index = "critiq.repository.cli:main"

[project]
name = "critiq"
version = "0.1.0"
description = "The Staff Engineer in your GitHub PR. AI PR reviews with evidence."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "arq>=0.26",
    "httpx>=0.27",
    "pyjwt>=2.8",
    "python-dotenv>=1.0",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "PyYAML>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "respx>=0.21",
    "types-PyYAML>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
