<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Critiq{% endblock %}</title>
<link rel="stylesheet" href="/static/dashboard.css">
<script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/dashboard"><span class="brand-mark">C</span>ritiq</a>
  <nav>
    <a href="/dashboard" class="{{ 'active' if active == 'overview' }}">Overview</a>
    <a href="/dashboard/repos" class="{{ 'active' if active == 'repos' }}">Repositories</a>
    <a href="/dashboard/runs" class="{{ 'active' if active == 'runs' }}">Review history</a>
    <a href="/docs" target="_blank" rel="noopener">API</a>
  </nav>
</header>
<main class="wrap">
{% block content %}{% endblock %}
</main>
<footer class="footer">
  Critiq &middot; The Staff Engineer in your GitHub PR
</footer>
</body>
</html>
